<p-fieldset legend="List ( Total: {{data.length}})" styleClass="mb-2" >
    <div class="mb-2">
        <input pInputText type="text" placeholder="Search by name" id="filter_attribute" #filter_attribute (input)="interactiveSearchAttribute(filter_attribute.value)">
        <i class="pi pi-search ml-2" (click)="searchAttribute(filter_attribute.value)"></i>
        <i class="pi pi-filter-slash view-margin-left ml-2" (click)="refreshAttributeFilter()"></i>
    </div>
    <p-table *ngIf="data && data" [value]="showedData" [tableStyle]="{ 'min-width': '50rem' }">
        <ng-template pTemplate="header">
            <tr>
                <th>Object id</th>
                <th>Name</th>
                <th>Type</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-item>
            <tr>
                <td>{{ item.object_id || "—"}}</td>
                <td>{{ item.name }}</td>
                <td>{{ item.type }}</td>
            </tr>
        </ng-template>
    </p-table>
</p-fieldset>
